# This is our package-publishing pipeline.
# When executed, it automatically publishes the output of the 'official pipeline' (the nupkgs) to our internal ADO feed.
# It may optionally also publish the signed packages to NuGet through ESRP, gated behind a manual approval.

trigger: none # only trigger is manual
pr: none # only trigger is manual

resources:
    repositories:
        - repository: 1es
          type: git
          name: 1ESPipelineTemplates/1ESPipelineTemplates
          ref: refs/tags/release
        - repository: eng
          type: git
          name: engineering
          ref: refs/tags/release

    pipelines:
    - pipeline: officialPipeline # Reference to the pipeline to be used as an artifact source
      source: 'durabletask-mssql.official'

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
        name: 1es-pool-azfunc
        image: 1es-windows-2022
        os: windows

    stages:
    - stage: release
      jobs:

      # ADO release
      - job: adoRelease
        displayName: ADO Release
        templateContext:
          inputs:
          - input: pipelineArtifact
            pipeline: officialPipeline  # Pipeline reference, as defined in the resources section
            artifactName: drop
            targetPath: $(System.DefaultWorkingDirectory)/drop

          # The preferred method of release on 1ES is by populating the 'output' section of a 1ES template.
          # Public NuGet publishing uses ESRP Release in the jobs below.
          # To read more about the 'output syntax', see:
          # - https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/1es-pipeline-templates/features/outputs
          # - https://eng.ms/docs/cloud-ai-platform/devdiv/one-engineering-system-1es/1es-docs/1es-pipeline-templates/features/outputs/nuget-packages
          outputs:
          - output: nuget # 'nuget' is an output "type" for pushing to NuGet
            displayName: 'Push to durabletask ADO feed'
            packageParentPath: $(System.DefaultWorkingDirectory) # This needs to be set to some prefix of the `packagesToPush` parameter. Apparently it helps with SDL tooling
            packagesToPush: '$(System.DefaultWorkingDirectory)/**/*.nupkg;!$(System.DefaultWorkingDirectory)/**/*.symbols.nupkg'
            publishVstsFeed: '3f99e810-c336-441f-8892-84983093ad7f/c895696b-ce37-4fe7-b7ce-74333a04f8bf'
            allowPackageConflicts: true

      # NuGet approval gate
      - job: nugetApproval
        displayName: NuGetApproval
        pool: server # This task only works when executed on serverl pools, so this needs to be specified
        steps:
          # Wait for manual approval.
          - task: ManualValidation@1
            inputs:
              instructions: Confirm you want to push to NuGet
              onTimeout: 'reject'

      # NuGet release (Microsoft.DurableTask.SqlServer)
      - job: nugetRelease_Microsoft_DurableTask_SqlServer
        displayName: NuGet Release (Microsoft.DurableTask.SqlServer)
        dependsOn:
        - nugetApproval
        - adoRelease
        condition: succeeded('nugetApproval', 'adoRelease')
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: officialPipeline  # Pipeline reference as defined in the resources section
            artifactName: drop
            targetPath: $(System.DefaultWorkingDirectory)/drop
        steps:
        - task: CopyFiles@2
          displayName: Stage Microsoft.DurableTask.SqlServer for ESRP
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)/drop'
            Contents: |
              Microsoft.DurableTask.SqlServer.*.nupkg
              !Microsoft.DurableTask.SqlServer.AzureFunctions*.nupkg
              !**/*.symbols.nupkg
            TargetFolder: '$(Agent.TempDirectory)/esrp-nuget'
            CleanTargetFolder: true
        - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@14
          displayName: 'ESRP Release Microsoft.DurableTask.SqlServer'
          inputs:
            connectedservicename: 'dtfx-internal-esrp-prod'
            usemanagedidentity: true
            keyvaultname: 'durable-esrp-akv'
            signcertname: 'dts-esrp-cert'
            clientid: '0b3ed1a4-0727-4a50-b82a-02c2bd9dec89'
            intent: 'PackageDistribution'
            contenttype: 'NuGet'
            organizationname: 'durabletask'
            contentsource: 'Folder'
            folderlocation: '$(Agent.TempDirectory)/esrp-nuget'
            waitforreleasecompletion: true
            owners: $(Build.RequestedForEmail)
            approvers: $(Build.RequestedForEmail)
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: 'ESRPRELPACMAN'
            domaintenantid: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'

      # NuGet release (Microsoft.DurableTask.SqlServer.AzureFunctions)
      - job: nugetRelease_Microsoft_DurableTask_SqlServer_AzureFunctions
        displayName: NuGet Release (Microsoft.DurableTask.SqlServer.AzureFunctions)
        dependsOn:
        - nugetApproval
        - adoRelease
        condition: succeeded('nugetApproval', 'adoRelease')
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: officialPipeline  # Pipeline reference as defined in the resources section
            artifactName: drop
            targetPath: $(System.DefaultWorkingDirectory)/drop
        steps:
        - task: CopyFiles@2
          displayName: Stage Microsoft.DurableTask.SqlServer.AzureFunctions for ESRP
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)/drop'
            Contents: |
              Microsoft.DurableTask.SqlServer.AzureFunctions.*.nupkg
              !**/*.symbols.nupkg
            TargetFolder: '$(Agent.TempDirectory)/esrp-nuget'
            CleanTargetFolder: true
        - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@14
          displayName: 'ESRP Release Microsoft.DurableTask.SqlServer.AzureFunctions'
          inputs:
            connectedservicename: 'dtfx-internal-esrp-prod'
            usemanagedidentity: true
            keyvaultname: 'durable-esrp-akv'
            signcertname: 'dts-esrp-cert'
            clientid: '0b3ed1a4-0727-4a50-b82a-02c2bd9dec89'
            intent: 'PackageDistribution'
            contenttype: 'NuGet'
            organizationname: 'durabletask'
            contentsource: 'Folder'
            folderlocation: '$(Agent.TempDirectory)/esrp-nuget'
            waitforreleasecompletion: true
            owners: $(Build.RequestedForEmail)
            approvers: $(Build.RequestedForEmail)
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: 'ESRPRELPACMAN'
            domaintenantid: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'


      # NuGet release (Microsoft.Azure.Functions.Worker.Extensions.DurableTask.SqlServer)
      - job: nugetRelease_Microsoft_Azure_Functions_Worker_Extensions_DurableTask_SqlServer
        displayName: NuGet Release (Microsoft.Azure.Functions.Worker.Extensions.DurableTask.SqlServer)
        dependsOn:
        - nugetApproval
        - adoRelease
        condition: succeeded('nugetApproval', 'adoRelease')
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            pipeline: officialPipeline  # Pipeline reference as defined in the resources section
            artifactName: drop
            targetPath: $(System.DefaultWorkingDirectory)/drop
        steps:
        - task: CopyFiles@2
          displayName: Stage Microsoft.Azure.Functions.Worker.Extensions.DurableTask.SqlServer for ESRP
          inputs:
            SourceFolder: '$(System.DefaultWorkingDirectory)/drop'
            Contents: |
              Microsoft.Azure.Functions.Worker.Extensions.DurableTask.SqlServer.*.nupkg
              !**/*.symbols.nupkg
            TargetFolder: '$(Agent.TempDirectory)/esrp-nuget'
            CleanTargetFolder: true
        - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@14
          displayName: 'ESRP Release Microsoft.Azure.Functions.Worker.Extensions.DurableTask.SqlServer'
          inputs:
            connectedservicename: 'dtfx-internal-esrp-prod'
            usemanagedidentity: true
            keyvaultname: 'durable-esrp-akv'
            signcertname: 'dts-esrp-cert'
            clientid: '0b3ed1a4-0727-4a50-b82a-02c2bd9dec89'
            intent: 'PackageDistribution'
            contenttype: 'NuGet'
            organizationname: 'durabletask'
            contentsource: 'Folder'
            folderlocation: '$(Agent.TempDirectory)/esrp-nuget'
            waitforreleasecompletion: true
            owners: $(Build.RequestedForEmail)
            approvers: $(Build.RequestedForEmail)
            serviceendpointurl: 'https://api.esrp.microsoft.com'
            mainpublisher: 'ESRPRELPACMAN'
            domaintenantid: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'
